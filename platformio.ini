; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;set default_envs to whichever board(s) you use. Build/Run/etc processes those envs
default_envs = seeed_xiao_esp32c3
;default_envs = nodemcu-32s
;default_envs = wemos_d1_mini32
;default_envs = lolin_s2_mini

[env]
; Global data for all [env:***]
framework = arduino
platform = espressif32
lib_ldf_mode = deep
;upload_speed = 115200
monitor_speed = 115200
;build_type = debug
lib_deps =
  ; Peg the SensESP version to 3.0.0 and compatible versions
  SignalK/SensESP @ ^3.0.0
  Adafruit SSD1306
  Adafruit INA219
build_flags =
  ;-D LED_BUILTIN=2
  ; Max (and default) debugging level in Arduino ESP32 Core
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE ;ARDUHAL_LOG_LEVEL_INFO
  ; Arduino Core bug workaround: define the log tag for the Arduino
  ; logging macros.
  -D TAG='"Arduino"'
  ; Use the ESP-IDF logging library - required by SensESP.
  -D USE_ESP_IDF_LOG
  ;-D ONLY_SETUP
build_unflags =
  -Werror=reorder+
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder

[env:seeed_xiao_esp32c3]
build_flags = ${env.build_flags} -D SEEED_XIAO_ESP32C3
board = seeed_xiao_esp32c3

[env:nodemcu-32s]
build_flags = ${env.build_flags} -D NODEMCU_32S
board = nodemcu-32s

[env:wemos_d1_mini32]
build_flags = ${env.build_flags} -D WEMOS_D1_MINI32
board = wemos_d1_mini32

[env:lolin_s2_mini]
build_flags = ${env.build_flags} -D LOLIN_S2_MINI
board = lolin_s2_mini